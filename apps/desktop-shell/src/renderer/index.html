<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: app-image:; connect-src 'self' ws: http://localhost:*;" />
    <title>MacroBay 观潮</title>
    <style>
      /* 首屏占位：内联、零外部资源，只为了不让窗口在全量 JS 解析期间一片空。
         底色与主窗创建时同源（`resolveWindowBackgroundColor`：深 #0b0d10 / 浅 #ffffff，取 OS 外观）；
         形态刻意克制——一行字，没有动画、没有 logo，挂载后由 `main.tsx` 在首帧之后移除。 */
      html,
      body {
        margin: 0;
        background: #0b0d10;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d10;
        color: #8a8f98;
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        letter-spacing: 0.08em;
        pointer-events: none;
      }
      @media (prefers-color-scheme: light) {
        html,
        body,
        #boot-splash {
          background: #ffffff;
        }
        #boot-splash {
          color: #6b7280;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">MacroBay 观潮</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
