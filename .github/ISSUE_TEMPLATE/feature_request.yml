name: Feature request
description: Ask for a capability, a source or a workflow.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas are easier to discuss in
        [Ideas](https://github.com/shawn-tangsc/MacroBay/discussions/new?category=ideas).
        Use this form when you can describe the problem concretely.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard panel
        - Data source or calendar
        - Analyst agent
        - Model service
        - Packaging and installers
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting
      description: Describe the situation where the current product falls short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like instead
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered
      description: Existing workarounds, other tools, or why they did not fit.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the roadmap and existing issues first.
          required: true
