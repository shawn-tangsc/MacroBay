name: Release

# The only packaging lane. A `v*` tag builds both installers on their own platform (the agent
# runtime ships a platform-native CLI binary that pnpm installs for the host only) and attaches
# them to one GitHub Release. A manual run can build any ref without publishing, which is the way
# to check packaging before cutting a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build — a `v*` tag to release, or a branch / sha for a dry run
        required: true
        type: string
      publish:
        description: Create or update the GitHub Release for that tag
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # `github.event.inputs` keeps this readable on both triggers; `inputs` would be null on a tag
  # push, while event inputs are simply absent there.
  BUILD_REF: ${{ github.event.inputs.ref || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}

jobs:
  macos:
    name: macOS arm64 dmg
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 用 Actions 表达式而不是 `$BUILD_REF`：Windows runner 的默认 shell 是 PowerShell，
      # `"$BUILD_REF"` 会展开成未定义的 PowerShell 变量（空串），版本校验因此收到空参数。
      - name: Check the tag matches the app version
        if: env.PUBLISH == 'true'
        run: node scripts/check-release-version.mjs "${{ env.BUILD_REF }}"

      # An x64 runner would pack a dmg without the arm64 agent CLI, and nothing downstream
      # would notice until the installed app failed to start.
      - name: Assert an arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Install
        run: pnpm install --frozen-lockfile

      # The root tsconfig covers the product sources too: peak RSS 2.8 GB, while Node sizes its
      # default heap from the runner's available memory (~2 GB) and tsc aborts with SIGABRT.
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # 打包前写 build-info.json：产物必须能反查提交与 tag，这条不依赖 Actions 页面留存。
      # `--require-clean`：带未提交改动打出的包，commit 记的是 HEAD，但构建用的不是它，发布通道直接红。
      - name: Write build info
        env:
          BUILD_PLATFORM: darwin
          BUILD_ARCH: arm64
        run: pnpm build:info "$BUILD_PLATFORM" "$BUILD_ARCH" --require-clean

      - name: Package macOS dmg
        run: pnpm exec electron-builder --mac dmg --arm64 --publish never

      - name: Verify the disk image
        run: hdiutil verify release/*.dmg

      - name: Assert stable artifact names
        run: |
          set -euo pipefail
          test -f release/MacroBay-arm64.dmg
          grep -q 'MacroBay-arm64.dmg' release/latest-mac.yml

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: macrobay-macos-arm64
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  macos-x64:
    name: macOS x64 dmg
    # Intel runner. `macos-13` was retired: the GitHub-hosted runner list now publishes macOS 15
    # x64 as `macos-15-intel` (and `macos-15-large`). If that label ever disappears too, cross-build
    # on `macos-latest` with pnpm `supportedArchitectures` for darwin/x64 and keep the
    # CLI-architecture assertion below (do not drop it).
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches the app version
        if: env.PUBLISH == 'true'
        run: node scripts/check-release-version.mjs "${{ env.BUILD_REF }}"

      # The agent CLI is installed by pnpm for the host architecture only. An arm64 runner
      # would pack an arm64 CLI into an x64 app and nothing downstream would notice until a
      # user launched it — so this job must run on Intel.
      - name: Assert an x64 runner
        run: test "$(uname -m)" = x86_64

      - name: Install
        run: pnpm install --frozen-lockfile

      # The root tsconfig covers the product sources too: peak RSS 2.8 GB, while Node sizes its
      # default heap from the runner's available memory (~2 GB) and tsc aborts with SIGABRT.
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Write build info
        env:
          BUILD_PLATFORM: darwin
          BUILD_ARCH: x64
        run: pnpm build:info "$BUILD_PLATFORM" "$BUILD_ARCH" --require-clean

      - name: Package macOS dmg
        run: pnpm exec electron-builder --mac dmg --x64 --publish never

      - name: Verify the disk image
        run: hdiutil verify release/MacroBay-x64.dmg

      # Build-level acceptance only: the app must be x86_64 and the bundled agent CLI must
      # be x86_64 too. This job does not launch the app.
      - name: Assert the app and the bundled agent CLI are x86_64
        run: |
          set -euo pipefail
          test -f release/MacroBay-x64.dmg
          file release/mac/MacroBay.app/Contents/MacOS/MacroBay | grep -q 'x86_64'
          cli="$(find release/mac/MacroBay.app/Contents/Resources -path '*claude-agent-sdk-darwin-x64/claude' -type f | head -1)"
          test -n "$cli"
          file "$cli" | grep -q 'x86_64'

      # `latest-mac.yml` is owned by the arm64 job: uploading it from here would point
      # `releases/latest/download/MacroBay-arm64.dmg` at the x64 build.
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: macrobay-macos-x64
          path: |
            release/MacroBay-x64.dmg
            release/MacroBay-x64.dmg.blockmap
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches the app version
        if: env.PUBLISH == 'true'
        run: node scripts/check-release-version.mjs "${{ env.BUILD_REF }}"

      - name: Install
        run: pnpm install --frozen-lockfile

      # The root tsconfig covers the product sources too: peak RSS 2.8 GB, while Node sizes its
      # default heap from the runner's available memory (~2 GB) and tsc aborts with SIGABRT.
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # 与 macOS 那条同构：以为打的是 x64、实际不是，这种事只会在用户机器上暴露。
      - name: Assert an x64 runner
        run: node -e "if (process.arch !== 'x64') { throw new Error('expected an x64 runner, got ' + process.arch) }"

      - name: Write build info
        env:
          BUILD_PLATFORM: win32
          BUILD_ARCH: x64
        run: pnpm build:info "$env:BUILD_PLATFORM" "$env:BUILD_ARCH" --require-clean

      - name: Package Windows installer
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Assert stable artifact names
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/MacroBay-x64-setup.exe')) { throw 'missing MacroBay-x64-setup.exe' }
          if (-not (Select-String -Path 'release/latest.yml' -Pattern 'MacroBay-x64-setup.exe' -Quiet)) { throw 'latest.yml does not reference the stable installer name' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: macrobay-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, macos-x64, windows]
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: macrobay-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # NUL-separated so no artifact name can be split into two arguments.
          list_assets() {
            find dist -type f \
              \( -name '*.dmg' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -print0
          }

          if [ ! -d dist ] || [ -z "$(list_assets | tr -d '\0')" ]; then
            echo "no installer files were downloaded from the build jobs" >&2
            exit 1
          fi
          echo 'attaching:'
          list_assets | tr '\0' '\n'

          # The release body **is** a page people read: the app's About page fetches it and shows it
          # as the notes for the version. So it is written per release, in both languages, next to
          # the long-form notes, and published verbatim — English first, then Chinese. Only the
          # paths come from the tag, so this block is the same at every release; the writing is
          # what changes.
          version="${BUILD_REF#v}"
          body_en="docs/reference/release-notes/${version}.release-body.md"
          body_zh="docs/reference/release-notes/${version}.release-body.zh-CN.md"
          for path in "$body_en" "$body_zh"; do
            if [ ! -f "$path" ]; then
              echo "missing release body: $path - write it before tagging; the preflight checks it" >&2
              exit 1
            fi
          done
          # `$(cat …)` drops each file's trailing newline, so the gap is exactly one blank line
          # whatever an editor left at the end of either file.
          body="${RUNNER_TEMP}/release-body.md"
          printf '%s\n\n%s\n' "$(cat "$body_en")" "$(cat "$body_zh")" >"$body"

          if gh release view "$BUILD_REF" >/dev/null 2>&1; then
            # Re-running a tag that already has a release replaces its assets **and its body**: a
            # sentence fixed after publication is republished by re-running the job, never by
            # moving the tag.
            list_assets | xargs -0 gh release upload "$BUILD_REF" --clobber
            gh release edit "$BUILD_REF" --notes-file "$body"
          else
            list_assets | xargs -0 gh release create "$BUILD_REF" \
              --title "MacroBay ${version}" \
              --notes-file "$body" \
              --verify-tag
          fi

          gh release view "$BUILD_REF" --json url -q .url
