name: CI

# Verification only. Installers are built by `release.yml`, which runs on a `v*` tag (or on
# demand), so a routine pull request never spends ten minutes packing a dmg nobody installs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 唯一验证入口：步骤定义在 package.json 的 `verify`，CI 不再各列一份。
      # 加一步只改那一处，AGENTS.md 与 release-process.md 指向同一命令，三处漂移由守卫测试挡住。
      - name: Verify
        run: pnpm verify
